[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiwatcher-mcp"
version = "0.1.6"
description = "AI news ingestion, distillation, and alert system â€” FastMCP 3.2 fleet server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "starlette>=0.46.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "feedparser>=6.0.11",
    "aiosmtplib>=3.0.0",
    "aiofiles>=24.1.0",
    "apscheduler>=3.10.4",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "anthropic>=0.52.0",
    "openai>=1.61.0",
    "premailer>=3.10.0",
    "fastapi>=0.138.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0,<0.17",
    "ty>=0.0.1a0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.21.0",
    "psutil>=6.1.0",
]

[project.scripts]
aiwatcher-mcp = "aiwatcher_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiwatcher_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: subprocess or full-stack integration (excluded from default CI)",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/", ".venv/"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.16.0,<0.17",
    "ty>=0.0.1a0",
    "psutil>=6.1.0",
    "pre-commit>=4.0.0",
]
